# ===================================================================
# EduVision – Complaint Monitoring Portal Configuration
# ===================================================================
spring.application.name=eduvision-backend
spring.profiles.active=dev

# Server Configuration
server.port=8080
server.servlet.context-path=/

# File Upload Multipart Configurations
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# JWT Security Settings
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# OpenAPI / Swagger Configurations
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://127.0.0.1:8080
