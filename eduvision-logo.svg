<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Radiant Golden Sunburst / Gear Gradients -->
    <linearGradient id="gearGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="innerSealBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c2b4e" />
    </radialGradient>
    <filter id="sealShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#78350f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Group for entire seal -->
  <g filter="url(#sealShadow)">
    <!-- 24 Flaming Sun Rays / Cogwheel Notches -->
    <!-- Outer scalloped circle -->
    <circle cx="60" cy="60" r="56" fill="url(#gearGradient)" />

    <!-- Notched cogwheel tooth cutouts / rays around circumference -->
    <!-- Layer of 16 radiating teeth -->
    <g fill="#b45309">
      <!-- Repeating petal notches for official emblem look -->
      <circle cx="60" cy="7" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
      <circle cx="81" cy="13" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
      <circle cx="98" cy="26" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
      <circle cx="109" cy="45" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
      <circle cx="113" cy="60" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
      <circle cx="109" cy="75" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
      <circle cx="98" cy="94" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
      <circle cx="81" cy="107" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
      <circle cx="60" cy="113" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
      <circle cx="39" cy="107" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
      <circle cx="22" cy="94" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
      <circle cx="11" cy="75" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
      <circle cx="7" cy="60" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
      <circle cx="11" cy="45" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
      <circle cx="22" cy="26" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
      <circle cx="39" cy="13" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
    </g>

    <!-- Concentric Gold Rings -->
    <circle cx="60" cy="60" r="49" fill="#d97706" />
    <circle cx="60" cy="60" r="47" fill="#fbbf24" />
    <circle cx="60" cy="60" r="44" fill="#92400e" />

    <!-- Deep Blue Inner Medallion -->
    <circle cx="60" cy="60" r="42" fill="url(#innerSealBg)" stroke="#fef08a" stroke-width="1.5" />

    <!-- Knowledge & Governance Centerpiece: Golden Torch, Book, Scales -->
    <!-- Open Book Base -->
    <path d="M60 84 C48 78 34 81 26 86 L26 66 C34 61 48 58 60 63 C72 58 86 61 94 66 L94 86 C86 81 72 78 60 84 Z" fill="#ffffff" opacity="0.95" />
    <path d="M60 63 L60 84" stroke="#0c2b4e" stroke-width="2" />
    <!-- Book lines representing regulations -->
    <line x1="33" y1="68" x2="53" y2="72" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="33" y1="74" x2="53" y2="78" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="67" y1="72" x2="87" y2="68" stroke="#94a3b8" stroke-width="1.2" />
    <line x1="67" y1="78" x2="87" y2="74" stroke="#94a3b8" stroke-width="1.2" />

    <!-- Torch of Wisdom Stem -->
    <path d="M57 58 L63 58 L61 42 L59 42 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1" />
    <!-- Flame -->
    <path d="M60 25 C65 31 68 37 60 43 C52 37 55 31 60 25 Z" fill="#ef4444" />
    <path d="M60 29 C62.5 33 64.5 37 60 41 C55.5 37 57.5 33 60 29 Z" fill="#fbbf24" />

    <!-- Central Text: EDUVISION -->
    <rect x="25" y="47" width="70" height="15" rx="3" fill="#07233b" stroke="#fbbf24" stroke-width="1" />
    <text x="60" y="58" font-family="'Inter', sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">EDUVISION</text>
  </g>
</svg>
