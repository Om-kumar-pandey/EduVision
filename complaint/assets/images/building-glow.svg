<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <defs>
    <linearGradient id="cyanGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0E2E52" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Subtle back glow -->
  <circle cx="80" cy="70" r="45" fill="#38BDF8" opacity="0.15" filter="url(#glow)"/>

  <!-- Buildings skyline -->
  <!-- Left building -->
  <rect x="25" y="45" width="30" height="65" rx="3" fill="#0C2B4E" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="32" y="55" width="6" height="6" fill="#38BDF8" opacity="0.8"/>
  <rect x="42" y="55" width="6" height="6" fill="#38BDF8" opacity="0.8"/>
  <rect x="32" y="68" width="6" height="6" fill="#38BDF8" opacity="0.8"/>
  <rect x="42" y="68" width="6" height="6" fill="#38BDF8" opacity="0.8"/>
  <rect x="32" y="81" width="6" height="6" fill="#38BDF8" opacity="0.8"/>
  <rect x="42" y="81" width="6" height="6" fill="#38BDF8" opacity="0.8"/>

  <!-- Center Main building -->
  <rect x="58" y="25" width="44" height="85" rx="4" fill="#0F3B6A" stroke="#00F0FF" stroke-width="1.8"/>
  <!-- Windows -->
  <rect x="66" y="36" width="7" height="7" fill="#67E8F9"/>
  <rect x="77" y="36" width="7" height="7" fill="#67E8F9"/>
  <rect x="88" y="36" width="7" height="7" fill="#67E8F9"/>
  <rect x="66" y="50" width="7" height="7" fill="#67E8F9"/>
  <rect x="77" y="50" width="7" height="7" fill="#67E8F9"/>
  <rect x="88" y="50" width="7" height="7" fill="#67E8F9"/>
  <rect x="66" y="64" width="7" height="7" fill="#67E8F9"/>
  <rect x="77" y="64" width="7" height="7" fill="#67E8F9"/>
  <rect x="88" y="64" width="7" height="7" fill="#67E8F9"/>
  <rect x="66" y="78" width="7" height="7" fill="#67E8F9"/>
  <rect x="77" y="78" width="7" height="7" fill="#67E8F9"/>
  <rect x="88" y="78" width="7" height="7" fill="#67E8F9"/>
  <rect x="75" y="93" width="10" height="17" fill="#0284C7"/>

  <!-- Right building -->
  <rect x="105" y="40" width="30" height="70" rx="3" fill="#0C2B4E" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="112" y="50" width="6" height="6" fill="#38BDF8" opacity="0.8"/>
  <rect x="122" y="50" width="6" height="6" fill="#38BDF8" opacity="0.8"/>
  <rect x="112" y="63" width="6" height="6" fill="#38BDF8" opacity="0.8"/>
  <rect x="122" y="63" width="6" height="6" fill="#38BDF8" opacity="0.8"/>
  <rect x="112" y="76" width="6" height="6" fill="#38BDF8" opacity="0.8"/>
  <rect x="122" y="76" width="6" height="6" fill="#38BDF8" opacity="0.8"/>

  <!-- Trees foreground -->
  <ellipse cx="20" cy="108" rx="14" ry="10" fill="#0D47A1" opacity="0.8"/>
  <ellipse cx="140" cy="108" rx="14" ry="10" fill="#0D47A1" opacity="0.8"/>
