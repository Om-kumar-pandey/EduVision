<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="85%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <linearGradient id="innerWheel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
  </defs>
  <!-- Sun rays outer gear ring -->
  <g fill="url(#sunGlow)">
    <circle cx="50" cy="50" r="44"/>
    <!-- 16 cog teeth/rays -->
    <path d="M47 3 h6 v8 h-6 z M47 89 h6 v8 h-6 z M3 47 h8 v6 h-8 z M89 47 h8 v6 h-8 z" />
    <g transform="rotate(22.5 50 50)"><path d="M47 3 h6 v8 h-6 z M47 89 h6 v8 h-6 z M3 47 h8 v6 h-8 z M89 47 h8 v6 h-8 z" /></g>
    <g transform="rotate(45 50 50)"><path d="M47 3 h6 v8 h-6 z M47 89 h6 v8 h-6 z M3 47 h8 v6 h-8 z M89 47 h8 v6 h-8 z" /></g>
    <g transform="rotate(67.5 50 50)"><path d="M47 3 h6 v8 h-6 z M47 89 h6 v8 h-6 z M3 47 h8 v6 h-8 z M89 47 h8 v6 h-8 z" /></g>
  </g>
  <!-- Inner Maroon Circle -->
  <circle cx="50" cy="50" r="32" fill="url(#innerWheel)"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="#FBBF24" stroke-width="1.5"/>
  <!-- AICTE Text arch representation -->
  <text x="50" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="7" font-weight="900" fill="#FDE047" text-anchor="middle">AICTE</text>
  <text x="50" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="4.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">योगः कर्मसु कौशलम्</text>
  <!-- Book / Lamp in center -->
  <path d="M40 54 Q50 50 60 54 L60 62 Q50 58 40 62 Z" fill="#FBBF24"/>
  <path d="M50 45 Q53 49 50 52 Q47 49 50 45 Z" fill="#38BDF8"/>
  <circle cx="50" cy="48" r="1.5" fill="#FFFFFF"/>
</svg>
